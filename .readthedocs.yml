version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # Install the package so mkdocstrings can import crem (rdkit, numpy, ...)
    # to render the API reference.
    - method: pip
      path: .
    - requirements: docs/requirements.txt
