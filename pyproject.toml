[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crem"
description = "CReM: chemically reasonable mutations framework"
readme = "README.md"
requires-python = ">=3.6"
authors = [{ name = "Pavel Polishchuk", email = "pavel_polishchuk@ukr.net" }]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "joblib",
    "tqdm",
    "numpy",
    "setuptools_scm>=8",
]
dynamic = ["version"]

[project.optional-dependencies]
rdkit = ["rdkit>=2017.09"]

[project.urls]
Homepage = "https://github.com/DrrDom/crem"

[project.scripts]
fragmentation        = "crem.fragmentation:entry_point"
frag_to_env          = "crem.frag_to_env_mp:entry_point"
env_to_db            = "crem.import_env_to_db:entry_point"
guacamol_test        = "crem.guacamol_crem_test:entry_point"
cremdb_add_prop      = "crem.scripts.cremdb_add_prop:entry_point"
cremdb_create        = "crem.scripts.cremdb_create:main"
cremdb_get_set_names = "crem.scripts.cremdb_get_set_names:main"
cremdb_merge         = "crem.scripts.cremdb_merge:main"
cremdb_convert       = "crem.scripts.cremdb_convert:main"

[tool.setuptools]
packages = ["crem", "crem.scripts"]
include-package-data = true
script-files = ["crem/scripts/crem_create_frag_db.sh"]

[tool.setuptools.package-data]
crem = ["scripts/*"]

[tool.setuptools_scm]
version_file = "crem/_version.py"
fallback_version = "0.0.0+unknown"
